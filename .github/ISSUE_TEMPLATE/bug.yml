name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove credentials, personal paths, private source, and unrelated logs before submitting.
        Use a private security advisory for sensitive vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including any status, warning, or stable error code?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a sanitized fixture or a small public example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: RepoPlane revision
      placeholder: commit or release
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, Other]
    validations:
      required: true
