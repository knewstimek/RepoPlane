name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify change scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          fi
          full=true
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            full=false
            while IFS= read -r path; do
              case "$path" in
                README.md|CHANGELOG.md|SECURITY.md|LICENSE|AGENTS.md|docs/*) ;;
                *) full=true; break ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ripgrep on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '15.2.0'
          $asset = "ripgrep-$version-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/BurntSushi/ripgrep/releases/download/$version"
          $destination = Join-Path $env:RUNNER_TEMP 'ripgrep'
          New-Item -ItemType Directory -Path $destination | Out-Null
          Invoke-WebRequest "$base/$asset" -OutFile "$destination/$asset" -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$base/$asset.sha256" -OutFile "$destination/$asset.sha256" -MaximumRetryCount 3 -RetryIntervalSec 5
          $expected = [regex]::Match((Get-Content "$destination/$asset.sha256" -Raw), '(?i)\b[0-9a-f]{64}\b').Value.ToLowerInvariant()
          $actual = (Get-FileHash "$destination/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ripgrep checksum mismatch"
          }
          Expand-Archive "$destination/$asset" -DestinationPath $destination
          $binary = Get-ChildItem $destination -Filter rg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "ripgrep archive did not contain rg.exe" }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check ripgrep
        run: rg --version
      - name: Preflight
        run: go run ./cmd/repoplane-dev preflight
      - name: Verify
        run: go run ./cmd/repoplane-dev verify

  public-release-check:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check tracked tree and reachable history
        run: go run ./cmd/repoplane-dev public-release-check

  race:
    needs: changes
    if: needs.changes.outputs.full == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Race tests
        run: go test -race ./...
