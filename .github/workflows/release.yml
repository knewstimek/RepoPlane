name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer with or without the leading v, for example 1.0.4
        required: true
        type: string
      notes_file:
        description: Tracked release-note path; empty uses docs/releases/vVERSION.md
        required: false
        default: ""
        type: string
      publish:
        description: Create the tag and public release; false performs a build-only dry run
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
      notes_file: ${{ steps.inputs.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release inputs and tracked notes
        id: inputs
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release dispatch must target main." >&2
            exit 1
          fi
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v$version"
          canonical_notes="docs/releases/$tag.md"
          notes_file="${INPUT_NOTES_FILE:-$canonical_notes}"
          if [[ "$notes_file" != "$canonical_notes" ]]; then
            echo "notes_file must be $canonical_notes for this release contract" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$notes_file" >/dev/null
          grep -Fqx "# RepoPlane $tag" "$notes_file"
          previous_line=0
          required_sections=(
            "Highlights"
            "What ships"
            "Safety model"
            "Install or upgrade"
            "Compatibility"
            "Verification"
            "Known limits"
          )
          for section in "${required_sections[@]}"; do
            line="$(grep -nFx "## $section" "$notes_file" | cut -d: -f1)"
            if [[ ! "$line" =~ ^[0-9]+$ ]] || (( line <= previous_line )); then
              echo "release note section is missing, duplicated, or out of order: $section" >&2
              exit 1
            fi
            previous_line="$line"
          done
          grep -Fq '(../../CHANGELOG.md)' "$notes_file"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "release checkout must be clean" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 10 \
            --json databaseId,headBranch,headSha,status,conclusion)"
          run_id="$(jq -r --arg sha "$GITHUB_SHA" \
            '[.[] | select(.headBranch == "main" and .headSha == $sha)][0].databaseId // empty' <<<"$runs")"
          if [[ -z "$run_id" ]]; then
            echo "No main CI run exists for $GITHUB_SHA." >&2
            exit 1
          fi
          status="$(jq -r --argjson id "$run_id" '.[] | select(.databaseId == $id) | .status' <<<"$runs")"
          if [[ "$status" != "completed" ]]; then
            gh run watch "$run_id" --exit-status
          fi
          conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Main CI run $run_id concluded $conclusion." >&2
            exit 1
          fi

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      NOTES_FILE: ${{ needs.gate.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build declared release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage/windows dist/stage/linux
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" -o dist/stage/windows/repoplane.exe ./cmd/repoplane
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" -o dist/stage/linux/repoplane ./cmd/repoplane
          grep -aFq "$TAG" dist/stage/windows/repoplane.exe
          grep -aFq "$TAG" dist/stage/linux/repoplane
          (cd dist/stage/windows && zip -q "../../repoplane_${VERSION}_windows_amd64.zip" repoplane.exe)
          tar -czf "dist/repoplane_${VERSION}_linux_amd64.tar.gz" -C dist/stage/linux repoplane
          printf '%s\n' \
            "$(sha256sum "dist/repoplane_${VERSION}_linux_amd64.tar.gz" | sed 's#  dist/#  #')" \
            "$(sha256sum "dist/repoplane_${VERSION}_windows_amd64.zip" | sed 's#  dist/#  #')" \
            > dist/SHA256SUMS.txt
          [[ "$(unzip -Z1 "dist/repoplane_${VERSION}_windows_amd64.zip")" == "repoplane.exe" ]]
          [[ "$(tar -tzf "dist/repoplane_${VERSION}_linux_amd64.tar.gz")" == "repoplane" ]]

      - name: Create or validate annotated tag
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git cat-file -t "$TAG")" == "tag" ]]
            [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]]
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" -m "RepoPlane $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish or repair GitHub Release
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/repoplane_${VERSION}_windows_amd64.zip"
            "dist/repoplane_${VERSION}_linux_amd64.tar.gz"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "RepoPlane $TAG" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "RepoPlane $TAG" --notes-file "$NOTES_FILE" --latest
          fi

      - name: Verify published bytes and metadata
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS.txt)
          release_json="$(gh release view "$TAG" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,targetCommitish,url,assets)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$TAG" ]]
          [[ "$(jq -r .name <<<"$release_json")" == "RepoPlane $TAG" ]]
          [[ "$(jq -r .isDraft <<<"$release_json")" == "false" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == "false" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]
          expected="$(printf '%s\n' SHA256SUMS.txt \
            "repoplane_${VERSION}_linux_amd64.tar.gz" \
            "repoplane_${VERSION}_windows_amd64.zip" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual" == "$expected" ]]
          jq --arg commit "$GITHUB_SHA" --arg latest "$TAG" \
            --rawfile checksums "$verify_dir/SHA256SUMS.txt" \
            '. + {commit: $commit, latest_tag: $latest, checksums: ($checksums | split("\n") | map(select(length > 0)))}' \
            <<<"$release_json" > dist/release-receipt.json
          cat dist/release-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain compact release receipt
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ env.TAG }}
          path: dist/release-receipt.json
          retention-days: 14

      - name: Retain dry-run assets
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.TAG }}
          path: |
            dist/repoplane_${{ env.VERSION }}_windows_amd64.zip
            dist/repoplane_${{ env.VERSION }}_linux_amd64.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 3
