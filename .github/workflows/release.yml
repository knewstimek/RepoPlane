name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer with or without the leading v, for example 1.0.4
        required: true
        type: string
      publish:
        description: Create the tag and public release; false performs a build-only dry run
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release inputs and changelog
        id: inputs
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release dispatch must target main." >&2
            exit 1
          fi
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v$version"
          [[ "$(grep -Ec "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md)" == "1" ]]
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "release checkout must be clean" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 10 \
            --json databaseId,headBranch,headSha,status,conclusion)"
          run_id="$(jq -r --arg sha "$GITHUB_SHA" \
            '[.[] | select(.headBranch == "main" and .headSha == $sha)][0].databaseId // empty' <<<"$runs")"
          if [[ -z "$run_id" ]]; then
            echo "No main CI run exists for $GITHUB_SHA." >&2
            exit 1
          fi
          status="$(jq -r --argjson id "$run_id" '.[] | select(.databaseId == $id) | .status' <<<"$runs")"
          if [[ "$status" != "completed" ]]; then
            gh run watch "$run_id" --exit-status
          fi
          conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Main CI run $run_id concluded $conclusion." >&2
            exit 1
          fi

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build declared release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage/windows dist/stage/linux
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" -o dist/stage/windows/repoplane.exe ./cmd/repoplane
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" -o dist/stage/linux/repoplane ./cmd/repoplane
          grep -aFq "$TAG" dist/stage/windows/repoplane.exe
          grep -aFq "$TAG" dist/stage/linux/repoplane
          rg_version=15.2.0
          rg_asset="ripgrep-${rg_version}-x86_64-pc-windows-msvc.zip"
          curl -fL --retry 3 -o "dist/stage/windows/$rg_asset" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${rg_version}/${rg_asset}"
          printf '%s  %s\n' \
            '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5' \
            "dist/stage/windows/$rg_asset" | sha256sum -c -
          unzip -p "dist/stage/windows/$rg_asset" '*/rg.exe' > dist/stage/windows/rg.exe
          unzip -p "dist/stage/windows/$rg_asset" '*/COPYING' > dist/stage/windows/ripgrep-COPYING.txt
          unzip -p "dist/stage/windows/$rg_asset" '*/LICENSE-MIT' > dist/stage/windows/ripgrep-LICENSE-MIT.txt
          unzip -p "dist/stage/windows/$rg_asset" '*/UNLICENSE' > dist/stage/windows/ripgrep-UNLICENSE.txt
          test -s dist/stage/windows/rg.exe
          test -s dist/stage/windows/ripgrep-LICENSE-MIT.txt
          (cd dist/stage/windows && zip -q "../../repoplane_${VERSION}_windows_amd64.zip" \
            repoplane.exe rg.exe ripgrep-COPYING.txt ripgrep-LICENSE-MIT.txt ripgrep-UNLICENSE.txt)
          tar -czf "dist/repoplane_${VERSION}_linux_amd64.tar.gz" -C dist/stage/linux repoplane
          printf '%s\n' \
            "$(sha256sum "dist/repoplane_${VERSION}_linux_amd64.tar.gz" | sed 's#  dist/#  #')" \
            "$(sha256sum "dist/repoplane_${VERSION}_windows_amd64.zip" | sed 's#  dist/#  #')" \
            > dist/SHA256SUMS.txt
          [[ "$(unzip -Z1 "dist/repoplane_${VERSION}_windows_amd64.zip" | sort)" == $'repoplane.exe\nrg.exe\nripgrep-COPYING.txt\nripgrep-LICENSE-MIT.txt\nripgrep-UNLICENSE.txt' ]]
          [[ "$(tar -tzf "dist/repoplane_${VERSION}_linux_amd64.tar.gz")" == "repoplane" ]]

      - name: Generate release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" -v tag="$TAG" '
            index($0, "## [" version "] - ") == 1 { found = 1; print "# RepoPlane " tag; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
          printf '\n[Full changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> dist/release-notes.md

      - name: Create or validate annotated tag
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git cat-file -t "$TAG")" == "tag" ]]
            [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]]
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" -m "RepoPlane $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish or repair GitHub Release
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/repoplane_${VERSION}_windows_amd64.zip"
            "dist/repoplane_${VERSION}_linux_amd64.tar.gz"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "RepoPlane $TAG" --notes-file dist/release-notes.md --latest
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "RepoPlane $TAG" --notes-file dist/release-notes.md --latest
          fi

      - name: Verify published bytes and metadata
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS.txt)
          release_json="$(gh release view "$TAG" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,targetCommitish,url,assets)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$TAG" ]]
          [[ "$(jq -r .name <<<"$release_json")" == "RepoPlane $TAG" ]]
          [[ "$(jq -r .isDraft <<<"$release_json")" == "false" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == "false" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]
          expected="$(printf '%s\n' SHA256SUMS.txt \
            "repoplane_${VERSION}_linux_amd64.tar.gz" \
            "repoplane_${VERSION}_windows_amd64.zip" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual" == "$expected" ]]
          jq --arg commit "$GITHUB_SHA" --arg latest "$TAG" \
            --rawfile checksums "$verify_dir/SHA256SUMS.txt" \
            '. + {commit: $commit, latest_tag: $latest, checksums: ($checksums | split("\n") | map(select(length > 0)))}' \
            <<<"$release_json" > dist/release-receipt.json
          cat dist/release-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain compact release receipt
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: release-receipt-${{ env.TAG }}
          path: dist/release-receipt.json
          retention-days: 14

      - name: Retain dry-run assets
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ env.TAG }}
          path: |
            dist/repoplane_${{ env.VERSION }}_windows_amd64.zip
            dist/repoplane_${{ env.VERSION }}_linux_amd64.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 3
