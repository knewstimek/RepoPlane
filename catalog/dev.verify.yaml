id: dev.verify
revision: 3
summary: Run bounded schema, test, vet, and build checks and write check-report.v1
use_when:
  - before completing an implementation change
  - when a reusable local verification report is needed
tags: [development, verification, report]
execution:
  kind: cli
  executable_ref: go
  cwd: .
  argv_template: [run, ./cmd/repoplane-dev, verify]
  trusted_for_run: true
  timeout_sec: 600
  artifact_mode: metadata
  preflight:
    - {id: go.version, kind: executable, ref: go, requirement: required, argv: [version]}
    - {id: git.repository, kind: git, requirement: required}
    - {id: rg.version, kind: executable, ref: rg, requirement: required, argv: [--version]}
inputs: [go.mod, go.sum, "cmd/**/*.go", "internal/**/*.go", "schemas/**", "catalog/**", "checks/**"]
outputs: [.tmp/reports/verify.json]
checks: [repository.verify]
docs: [CONTRIBUTING.md, README.md]
cache_policy: disabled
