id: dev.public-release-check
revision: 2
summary: Scan the tracked tree and Git history for unreviewed public-release privacy findings
use_when:
  - before a public push or release
tags: [development, security, release]
execution:
  kind: cli
  executable_ref: go
  cwd: .
  argv_template: [run, ./cmd/repoplane-dev, public-release-check]
  trusted_for_run: true
  timeout_sec: 300
  artifact_mode: metadata
  preflight:
    - {id: go.version, kind: executable, ref: go, requirement: required, argv: [version]}
    - {id: git.repository, kind: git, requirement: required}
outputs: [.tmp/reports/public-release-check.json]
docs: [README.md, AGENTS.md]
cache_policy: disabled
