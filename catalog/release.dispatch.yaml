id: release.dispatch
revision: 2
summary: Dispatch the guarded GitHub release workflow using the tracked changelog
use_when:
  - publishing a prepared stable release after its main CI run succeeds
tags: [release, github, publish]
execution:
  kind: cli
  executable_ref: gh
  cwd: .
  argv_template:
    - workflow
    - run
    - release.yml
    - --ref
    - main
    - --field
    - version={version}
    - --field
    - publish=true
  trusted_for_run: true
  timeout_sec: 30
  artifact_mode: metadata
  preflight:
    - {id: gh.version, kind: executable, ref: gh, requirement: required, argv: [--version]}
    - {id: git.repository, kind: git, requirement: required}
arguments:
  version:
    type: string
    required: true
    description: Stable SemVer with or without the leading v
inputs: [.github/workflows/release.yml, CHANGELOG.md]
docs: [README.md, CHANGELOG.md]
cache_policy: disabled
